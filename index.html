<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174b83">
  <meta name="description" content="A clear, caring guide to staying safe from online scams.">
  <title>ElderShield — Your Digital Safety Guardian</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --blue: #174a78;
      --ink: #263746;
      --muted: #536a7c;
      --line: #dce5eb;
      --canvas: #f2f6f7;
      --green: #23663f;
      --green-bg: #e8f4eb;
      --amber: #80500b;
      --amber-bg: #fff3d9;
      --red: #a32f2a;
      --red-bg: #fff0ed;
      --shadow: 0 5px 18px rgba(38, 62, 80, .055);
      font-family: Arial, sans-serif;
      color: var(--ink);
      font-size: 18px;
    }

    body { margin: 0; background: var(--canvas); line-height: 1.6; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #82b7e9;
      outline-offset: 2px;
    }

    #app { min-height: 100vh; }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 20;
      transform: translateY(-160%);
      padding: 12px 16px;
      border: 2px solid var(--blue);
      border-radius: 8px;
      background: white;
      color: var(--blue);
      font-weight: 700;
    }
    .skip-link:focus { transform: translateY(0); }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      width: 268px;
      padding: 30px 20px 20px;
      border-right: 1px solid var(--line);
      background: white;
    }

    .brand, .mobile-brand {
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 6px 44px;
      color: #183c63;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.1;
    }
    .brand > span:last-child > span { color: #5184b6; }
    .brand small {
      display: block;
      margin-top: 7px;
      color: #536a7c;
      font-size: 12px;
      font-weight: 500;
    }
    .brand-icon { font-size: 32px; }

    .side-label {
      padding: 0 12px 12px;
      color: #536a7c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .side-nav { display: grid; gap: 5px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 52px;
      padding: 12px 13px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #526a7b;
      text-align: left;
      font-size: 16px;
      font-weight: 600;
    }
    .nav-item span {
      width: 22px;
      color: #71889a;
      font-size: 23px;
      text-align: center;
    }
    .nav-item:hover, .nav-item.active {
      background: #edf4fa;
      color: var(--blue);
    }
    .nav-item.active { font-weight: 700; }
    .nav-item.active span { color: var(--blue); }

    .sidebar-spacer { flex: 1; }
    .help-card {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
      padding: 17px;
      border: 1px solid #e3ecf3;
      border-radius: 14px;
      background: #f5f9fc;
      color: var(--ink);
      text-align: left;
    }
    .help-icon { color: #6c91af; font-size: 21px; }
    .help-card strong { font-size: 15px; }
    .help-card > span:last-child { color: #456b86; font-size: 13px; }

    .side-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 17px 2px 0;
      border-top: 1px solid var(--line);
    }
    .avatar {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e3eef7;
      color: #285b84;
      font-size: 12px;
      font-weight: 700;
    }
    .avatar.small { width: 30px; height: 30px; font-size: 10px; }
    .side-user strong, .side-user small { display: block; }
    .side-user strong { font-size: 14px; }
    .side-user small { margin-top: 3px; color: #536a7c; font-size: 12px; }
    .more {
      margin-left: auto;
      border: 0;
      background: transparent;
      color: #526a7b;
      font-size: 20px;
    }

    .main-area {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin-left: 268px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      padding: 0 clamp(26px, 4vw, 64px);
      border-bottom: 1px solid var(--line);
      background: white;
    }
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #536a7c;
      font-size: 14px;
    }
    .breadcrumbs strong { color: #344c60; }
    .top-actions { display: flex; align-items: center; gap: 16px; }
    .icon-btn {
      position: relative;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #f1f5f7;
      color: #45647c;
      font-size: 21px;
    }
    .icon-btn i {
      position: absolute;
      top: 7px;
      right: 8px;
      width: 8px;
      height: 8px;
      border: 1px solid white;
      border-radius: 50%;
      background: #de655e;
    }
    .profile-pill {
      display: flex;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      color: #40596e;
      font-size: 14px;
    }
    .mobile-brand, .mobile-nav { display: none; }

    .view {
      flex: 1;
      width: min(1220px, 100%);
      margin: 0 auto;
      padding: 44px clamp(26px, 4vw, 64px) 56px;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 clamp(26px, 4vw, 64px);
      border-top: 1px solid var(--line);
      color: #536a7c;
      font-size: 12px;
    }
    .lock { color: #43855a; font-size: 9px; }

    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { letter-spacing: -.4px; }
    h1 { margin-bottom: 8px; color: #193d63; font-size: 36px; line-height: 1.2; }
    h2 { color: #234261; font-size: 22px; }
    .subhead { margin: 0; color: #536a7c; font-size: 17px; line-height: 1.6; }
    .eyebrow {
      color: #536c7f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }
    .page-head { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    .page-head h1 { margin: 10px 0 8px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 52px;
      padding: 0 21px;
      border: 0;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 700;
      transition: .16s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--blue); color: white; }
    .btn-soft { border: 1px solid #d3e0e8; background: #e8f0f4; color: var(--blue); }
    .btn-white { border: 1px solid var(--line); background: white; color: var(--blue); }
    .btn-danger { background: var(--red); color: white; }
    .btn-block { width: 100%; }
    .text-button {
      padding: 8px;
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
    }

    .card {
      border: 1px solid #e1e8ec;
      border-radius: 15px;
      background: white;
      box-shadow: var(--shadow);
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      min-height: 220px;
      margin-bottom: 22px;
      padding: 34px 38px;
      overflow: hidden;
      border-radius: 18px;
      background: linear-gradient(115deg, #174a78, #2e7094);
      color: white;
    }
    .hero-copy { max-width: 680px; }
    .hero .eyebrow { color: #d4e5ed; }
    .hero h1 { margin: 10px 0; color: white; font-size: 33px; }
    .hero p { max-width: 620px; margin: 0; color: #e1edf3; font-size: 17px; }
    .hero .btn { flex: 0 0 auto; }
    .status-row { display: flex; align-items: center; gap: 10px; margin-top: 20px; font-size: 14px; }
    .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #8ed2a4; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(290px, .9fr);
      gap: 22px;
    }
    .section-card { padding: 26px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .section-head h2 { margin: 0; font-size: 19px; }
    .subtle { color: #536a7c; font-size: 13px; }

    .form-label { display: block; margin-bottom: 9px; color: #40566e; font-size: 15px; font-weight: 700; }
    .scan-input {
      width: 100%;
      min-height: 130px;
      padding: 16px;
      resize: vertical;
      border: 1px solid #ccd9e1;
      border-radius: 11px;
      background: #fbfcfd;
      color: #35475b;
      font-size: 17px;
      line-height: 1.6;
    }
    .scan-input::placeholder { color: #697d8d; }
    .scan-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; }
    .helper { color: #526a7b; font-size: 13px; }
    .quick-types { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 13px; }
    .chip-button {
      min-height: 42px;
      padding: 8px 14px;
      border: 1px solid #dce5eb;
      border-radius: 22px;
      background: white;
      color: #3f5d73;
      font-size: 13px;
    }
    .chip-button:hover { background: #f2f7fb; }

    .recent { margin-top: 22px; }
    .recent-row { display: flex; align-items: center; gap: 14px; min-height: 66px; padding: 12px 0; border-top: 1px solid #edf0f2; }
    .risk-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: #d9a545; }
    .risk-dot.high { background: #d55e59; }
    .risk-dot.low { background: #55a878; }
    .row-main { flex: 1; min-width: 0; }
    .row-main strong { display: block; overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .row-main small { display: block; margin-top: 4px; color: #586e7e; font-size: 12px; }
    .badge { padding: 6px 11px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .badge.low { background: var(--green-bg); color: var(--green); }
    .badge.suspicious { background: var(--amber-bg); color: var(--amber); }
    .badge.high { background: var(--red-bg); color: var(--red); }
    .arrow { border: 0; background: transparent; color: #536a7c; font-size: 20px; }

    .safety-score { display: flex; align-items: center; gap: 14px; padding: 8px 0 18px; }
    .score-ring {
      position: relative;
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: conic-gradient(#57a678 0deg 301deg, #eaf0ed 301deg);
    }
    .score-ring:before { position: absolute; inset: 7px; border-radius: 50%; background: white; content: ''; }
    .score-ring strong { position: relative; color: #306c4c; font-size: 18px; }
    .safety-score strong { color: #36536d; font-size: 16px; }
    .safety-score small { display: block; margin-top: 4px; color: #536a7b; font-size: 13px; }
    .safe-item { display: flex; gap: 10px; padding: 14px 0; border-top: 1px solid #f0f2f4; color: #526a7b; font-size: 14px; }
    .checkmark { display: grid; flex: 0 0 auto; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #e9f5ed; color: #35734d; }

    .tip-of-day { margin-top: 16px; padding: 19px; border: 1px solid #efead9; border-radius: 12px; background: #f8f6ef; }
    .tip-of-day .tip-icon { font-size: 22px; }
    .tip-of-day h3 { margin: 9px 0 6px; color: #6d5725; font-size: 16px; }
    .tip-of-day p { margin: 0; color: #665a3c; font-size: 14px; }

    .feature-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 84px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      color: var(--ink);
      text-align: left;
    }
    .feature:hover { border-color: #bacddd; box-shadow: var(--shadow); }
    .feature-icon { display: grid; flex: 0 0 auto; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: #eef4f8; font-size: 21px; }
    .feature strong { display: block; font-size: 14px; }
    .feature small { display: block; margin-top: 5px; color: #536a7b; font-size: 12px; }
    .feature > span:last-child { margin-left: auto; color: #536a7c; }

    .scan-layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(230px, .8fr); gap: 22px; }
    .form-card { padding: 28px; }
    .scan-tabs { display: flex; gap: 25px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
    .scan-tab { min-height: 48px; padding: 0 3px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: #536a7c; font-size: 15px; font-weight: 600; }
    .scan-tab.active { border-color: var(--blue); color: var(--blue); }
    .form-card .scan-input { min-height: 210px; }
    .hint-box { margin-top: 15px; padding: 16px; border-radius: 11px; background: #f3f7fa; color: #435e72; font-size: 14px; }
    .info-card { height: max-content; padding: 24px; }
    .info-card h2 { font-size: 18px; }
    .info-step { display: flex; gap: 11px; margin: 16px 0; }
    .step-num { display: grid; flex: 0 0 auto; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #edf3f7; color: #4d7598; font-size: 13px; font-weight: 700; }
    .info-step p { margin: 1px 0; color: #4e6577; font-size: 14px; }
    .privacy-note { padding-top: 14px; border-top: 1px solid var(--line); color: #52697a; font-size: 12px; }

    .result-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; padding: 28px; border-radius: 15px; }
    .result-hero.high { border: 1px solid #f4d7d5; background: var(--red-bg); }
    .result-hero.suspicious { border: 1px solid #f1e3c3; background: var(--amber-bg); }
    .result-hero.low { border: 1px solid #d4eadb; background: var(--green-bg); }
    .result-symbol { font-size: 34px; }
    .result-hero h2 { margin: 0 0 6px; font-size: 23px; }
    .result-hero p { margin: 0; color: #4f5f68; font-size: 16px; }
    .result-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
    .result-card { padding: 27px; }
    .reason { display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid #eff1f3; }
    .reason:first-of-type { border-top: 0; }
    .reason strong { display: block; font-size: 15px; }
    .reason p { margin: 4px 0 0; color: #536a7b; font-size: 14px; }
    .message-preview { padding: 15px; border-radius: 8px; background: #f7f9fb; color: #43596c; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .trust-score { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .trust-score > strong { color: #a45345; font-size: 28px; }
    .trust-bar { height: 7px; margin: 12px 0; border-radius: 8px; background: #f0e6e3; }
    .trust-bar span { display: block; height: 100%; border-radius: 8px; background: #d36559; }
    .notice { margin-top: 14px; color: #52697a; font-size: 12px; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .filter-pill { min-height: 42px; padding: 8px 16px; border: 1px solid #e2e8ee; border-radius: 22px; background: white; color: #4f6577; font-size: 14px; }
    .filter-pill.active { border-color: #eaf1f7; background: #eaf1f7; color: var(--blue); font-weight: 700; }
    .table-card { overflow: hidden; }
    .history-row { display: flex; align-items: center; gap: 16px; min-height: 78px; padding: 16px 20px; border-top: 1px solid #eff1f4; cursor: pointer; }
    .history-row:hover { background: #fbfcfd; }
    .history-icon { display: grid; flex: 0 0 auto; place-items: center; width: 44px; height: 44px; border-radius: 9px; background: #f2f5f8; color: #526f87; font-size: 19px; }
    .history-date { color: #536a7c; font-size: 13px; }
    .empty-state { padding: 45px 20px; color: #536a7c; text-align: center; }

    .tips-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .tip-card { padding: 23px; }
    .tip-card .big-icon { font-size: 30px; }
    .tip-card h3 { margin: 12px 0 7px; color: #34516d; font-size: 18px; }
    .tip-card p { color: #4f6576; font-size: 14px; }
    .tag { padding: 5px 8px; border-radius: 20px; background: #eff4f7; color: #526f83; font-size: 12px; }

    .emergency-banner { display: flex; gap: 14px; margin-bottom: 19px; padding: 25px; border: 1px solid #f3d4d2; border-radius: 14px; background: #fff0ef; }
    .emergency-banner strong { color: #963e3a; font-size: 20px; }
    .emergency-banner p { margin: 5px 0 0; color: #66514e; font-size: 15px; }
    .recovery-list { padding: 6px 22px; }
    .recovery-step { display: flex; gap: 17px; padding: 20px 0; border-bottom: 1px solid #edf0f3; }
    .recovery-step:last-child { border: 0; }
    .step-check { flex: 0 0 auto; width: 25px; height: 25px; margin: 0; cursor: pointer; }
    .recovery-step strong { display: block; font-size: 16px; }
    .recovery-step p { margin: 5px 0 0; color: #536a7b; font-size: 14px; }
    .inline-link { color: #174a78; text-decoration: underline; }

    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .settings-card { padding: 25px; }
    .settings-card h2 { font-size: 18px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 0; border-top: 1px solid #eff1f4; font-size: 14px; }
    .setting-row small { display: block; margin-top: 4px; color: #536a7b; font-size: 12px; }
    .contact { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #eff1f4; }
    .contact strong { font-size: 14px; }
    .contact small { display: block; color: #536a7b; font-size: 12px; }

    .switch { position: relative; flex: 0 0 auto; width: 46px; height: 26px; }
    .switch input { position: absolute; opacity: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 20px; background: #cbd4dd; }
    .switch span:before { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: white; content: ''; transition: .2s; }
    .switch input:checked + span { background: #4a8b68; }
    .switch input:checked + span:before { transform: translateX(20px); }

    .modal { width: min(470px, calc(100vw - 30px)); padding: 0; border: 0; border-radius: 14px; color: var(--ink); box-shadow: 0 20px 80px #152e4940; }
    .modal::backdrop { background: #182c3f70; }
    .modal-inner { padding: 25px; }
    .modal h2 { margin: 0 0 8px; font-size: 22px; }
    .modal p { color: #4f6576; font-size: 16px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    .toast {
      position: fixed;
      z-index: 9;
      bottom: 25px;
      left: 50%;
      transform: translate(-50%, 15px);
      padding: 14px 20px;
      border-radius: 9px;
      background: #243f59;
      color: white;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .noscript-message { margin: 16px; padding: 16px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); }

    @media (max-width: 950px) {
      .sidebar { width: 230px; }
      .main-area { margin-left: 230px; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .scan-layout { grid-template-columns: 1fr; }
      .info-card { display: none; }
    }

    @media (max-width: 680px) {
      .sidebar { display: none; }
      .main-area { margin: 0; padding-bottom: 70px; }
      .topbar { min-height: 62px; padding: 0 18px; }
      .mobile-brand { display: block; color: #20496d; font-size: 17px; font-weight: 800; }
      .mobile-brand span { font-size: 21px; vertical-align: -2px; }
      .breadcrumbs, .profile-pill { display: none; }
      .view { padding: 28px 18px 38px; }
      .footer { height: 48px; padding: 0 18px; font-size: 11px; }
      .mobile-nav {
        position: fixed;
        inset: auto 0 0;
        z-index: 4;
        display: flex;
        justify-content: space-around;
        height: 70px;
        padding-bottom: env(safe-area-inset-bottom);
        border-top: 1px solid var(--line);
        background: white;
      }
      .mobile-nav button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-width: 58px;
        border: 0;
        background: transparent;
        color: #536a7b;
        font-size: 11px;
      }
      .mobile-nav button span { font-size: 22px; }
      .mobile-nav button.active { color: var(--blue); font-weight: 700; }
      h1, .page-head h1 { font-size: 30px; }
      .subhead { font-size: 16px; }
      .hero { display: block; min-height: 0; padding: 26px 22px; }
      .hero h1 { font-size: 27px; }
      .hero p { font-size: 16px; }
      .hero .btn { display: flex; width: 100%; margin-top: 20px; }
      .page-head { flex-direction: column; margin-bottom: 22px; }
      .section-card, .form-card, .result-card, .settings-card { padding: 20px; }
      .scan-controls { align-items: stretch; flex-direction: column; }
      .scan-controls .btn { width: 100%; }
      .feature-row, .tips-grid, .result-grid, .settings-grid { grid-template-columns: 1fr; }
      .feature-row { gap: 10px; margin-top: 16px; }
      .feature { padding: 14px; }
      .result-hero { gap: 10px; padding: 19px; }
      .result-hero .badge, .history-row .badge { display: none; }
      .result-actions { display: grid; }
      .result-actions .btn { width: 100%; }
      .history-row { gap: 10px; padding: 14px 12px; }
      .history-row .row-main strong { font-size: 13px; }
      .footer span:first-child { display: none; }
      .footer { justify-content: flex-end; }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div id="app">
    <aside class="sidebar" aria-label="ElderShield sidebar">
      <button class="brand" type="button" data-page="home" aria-label="ElderShield home">
        <span class="brand-icon" aria-hidden="true">🛡️</span>
        <span class="brand-name">Elder<span>Shield</span><small>Your Digital Safety Guardian</small></span>
      </button>

      <p class="side-label">Your space</p>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" type="button" data-page="home" aria-current="page"><span aria-hidden="true">⌂</span> Home</button>
        <button class="nav-item" type="button" data-page="scan"><span aria-hidden="true">⌕</span> Check a message</button>
        <button class="nav-item" type="button" data-page="history"><span aria-hidden="true">▤</span> Scan history</button>
        <button class="nav-item" type="button" data-page="tips"><span aria-hidden="true">✳</span> Safety tips</button>
        <button class="nav-item" type="button" data-page="profile"><span aria-hidden="true">♙</span> My settings</button>
      </nav>

      <div class="sidebar-spacer" aria-hidden="true"></div>

      <button class="help-card" type="button" data-page="emergency">
        <span class="help-icon" aria-hidden="true">♥</span>
        <strong>Need help right now?</strong>
        <span>Open your recovery guide <span aria-hidden="true">→</span></span>
      </button>

      <section class="side-user" aria-label="Signed-in profile">
        <div class="avatar" aria-hidden="true">JM</div>
        <div><strong>Jamie Morgan</strong><small>Personal account</small></div>
        <button class="more" type="button" aria-label="More account options">···</button>
      </section>
    </aside>

    <main class="main-area" id="main-content">
      <header class="topbar">
        <button class="mobile-brand" type="button" data-page="home" aria-label="ElderShield home">
          <span aria-hidden="true">🛡️</span> ElderShield
        </button>

        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <span>My safety</span><span aria-hidden="true">/</span><strong id="crumb">Home</strong>
        </nav>

        <div class="top-actions">
          <button class="icon-btn" type="button" aria-label="Notifications">♧<i aria-hidden="true"></i></button>
          <button class="profile-pill" type="button" data-page="profile" aria-label="Open Jamie’s settings">
            <span class="avatar small" aria-hidden="true">JM</span><span>Jamie</span><span aria-hidden="true">⌄</span>
          </button>
        </div>
      </header>

      <section id="view" class="view" tabindex="-1" aria-label="Current page content"></section>

      <footer class="footer">
        <span>Made for peace of mind.</span>
        <span><span class="lock" aria-hidden="true">●</span> Your checks stay on this device</span>
      </footer>
    </main>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="active" type="button" data-page="home" aria-current="page"><span aria-hidden="true">⌂</span> Home</button>
      <button type="button" data-page="scan"><span aria-hidden="true">⌕</span> Check</button>
      <button type="button" data-page="history"><span aria-hidden="true">▤</span> History</button>
      <button type="button" data-page="tips"><span aria-hidden="true">✳</span> Tips</button>
      <button type="button" data-page="profile"><span aria-hidden="true">♙</span> Settings</button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>

    <noscript><p class="noscript-message">Please enable JavaScript to use ElderShield.</p></noscript>
  </div>

  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];

    const store = {
      get(k, d) {
        try { return JSON.parse(localStorage.getItem('eldershield-' + k)) ?? d; }
        catch { return d; }
      },
      set(k, v) {
        localStorage.setItem('eldershield-' + k, JSON.stringify(v));
      }
    };

    let page = 'home';
    let scanType = 'message';
    let currentResult = null;
    let filter = 'All';

    let scans = store.get('scans', [
      { id: 1, type: 'message', risk: 'suspicious', preview: 'Your parcel delivery needs a small fee…', date: 'Today, 9:42 AM', reasons: ['Asks you to pay a fee through a link', 'Creates pressure to act quickly'] },
      { id: 2, type: 'link', risk: 'low', preview: 'www.gov.uk — government services', date: 'Yesterday, 2:18 PM', reasons: ['No obvious warning signs found'] },
      { id: 3, type: 'message', risk: 'high', preview: 'Your account will be closed. Reply with your one-time code…', date: 'Oct 27, 11:06 AM', reasons: ['Requests a one-time passcode', 'Uses urgent account threat'] }
    ]);

    const names = {
      home: 'Home',
      scan: 'Check a message',
      results: 'Check results',
      history: 'Scan history',
      tips: 'Safety tips',
      profile: 'My settings',
      emergency: 'Recovery guide',
      family: 'Family support'
    };

    const riskLabel = {
      low: 'Looks safer',
      suspicious: 'Take a closer look',
      high: 'High risk'
    };

    const esc = s => String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    function go(p) {
      page = p;
      $('#crumb').textContent = names[p] || 'Home';
      $$('[data-page]').forEach(button => {
        const active = button.dataset.page === p;
        button.classList.toggle('active', active);
        if (active) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      render();
      window.scrollTo(0, 0);
    }

    function badge(risk) {
      return `<span class="badge ${risk}">${riskLabel[risk]}</span>`;
    }

    function head(kicker, title, subtitle) {
      return `<div class="page-head">
        <div>
          <div class="eyebrow">${kicker}</div>
          <h1>${title}</h1>
          <p class="subhead">${subtitle}</p>
        </div>
      </div>`;
    }

    function scanRow(scan) {
      return `<div class="recent-row" role="button" tabindex="0" data-result="${scan.id}">
        <span class="risk-dot ${scan.risk}"></span>
        <div class="row-main">
          <strong>${esc(scan.preview)}</strong>
          <small>${scan.type[0].toUpperCase() + scan.type.slice(1)} · ${scan.date}</small>
        </div>
        ${badge(scan.risk)}
        <button class="arrow" aria-label="View scan">›</button>
      </div>`;
    }

    function dashboard() {
      return `${head(
        'YOUR DAILY SAFETY CHECK-IN',
        'Good morning, Jamie ☀️',
        'You’re taking a thoughtful step by checking before you click.'
      )}
        <section class="hero">
          <div class="hero-copy">
            <div class="eyebrow">A MOMENT OF CARE</div>
            <h1>You’re in a good place.</h1>
            <p>No urgent threats have been reported today. If a message feels unusual, bring it here and we’ll look at it together.</p>
            <div class="status-row"><span class="live-dot"></span> Your safety check-in is ready</div>
          </div>
          <button class="btn btn-white" data-go="scan">Check a message <span aria-hidden="true">→</span></button>
        </section>

        <section class="dashboard-grid">
          <div>
            <div class="card section-card">
              <div class="section-head">
                <h2>Let’s check something together</h2>
                <span class="subtle">Private and simple</span>
              </div>
              <label class="form-label" for="quick-message">Paste a message or link here</label>
              <textarea id="quick-message" class="scan-input" placeholder="Paste a text message, email, or website address…"></textarea>
              <div class="scan-controls">
                <span class="helper">You can remove personal details before checking.</span>
                <button class="btn btn-primary" id="quick-check">Check it for me <span aria-hidden="true">→</span></button>
              </div>
              <div class="quick-types">
                <button class="chip-button" data-type="message">✉ Message</button>
                <button class="chip-button" data-type="link">↗ Website link</button>
                <button class="chip-button" data-type="attachment">▧ Email attachment</button>
              </div>
            </div>

            <div class="card section-card recent">
              <div class="section-head">
                <h2>Recent checks</h2>
                <button class="text-button" data-go="history">View all →</button>
              </div>
              ${scans.slice(0, 2).map(scanRow).join('') || '<p class="subhead">Your checks will appear here.</p>'}
            </div>
          </div>

          <div class="card section-card safety-card">
            <div class="section-head">
              <h2>Your safety today</h2>
              <span class="subtle">A little care goes a long way</span>
            </div>
            <div class="safety-score">
              <div class="score-ring"><strong>84</strong></div>
              <div><strong>Looking good</strong><small>Your safety habits are building.</small></div>
            </div>
            <div class="safe-item"><span class="checkmark">✓</span><span>You checked before responding to a message.</span></div>
            <div class="safe-item"><span class="checkmark">✓</span><span>Your family contact is ready if you need a hand.</span></div>
            <div class="tip-of-day">
              <span class="tip-icon">💡</span>
              <h3>A gentle reminder</h3>
              <p>Your bank will never ask you to share a one-time code by text or phone.</p>
            </div>
          </div>
        </section>

        <section class="feature-row">
          <button class="feature" data-go="scan" data-kind="link">
            <span class="feature-icon">🔗</span>
            <span><strong>Check a website</strong><small>Look at a link before opening it</small></span>
            <span aria-hidden="true">›</span>
          </button>
          <button class="feature" data-go="emergency">
            <span class="feature-icon">🧭</span>
            <span><strong>I may have been scammed</strong><small>Get calm, practical next steps</small></span>
            <span aria-hidden="true">›</span>
          </button>
          <button class="feature" data-go="family">
            <span class="feature-icon">👨‍👩‍👧</span>
            <span><strong>Ask my family</strong><small>Get help from someone you trust</small></span>
            <span aria-hidden="true">›</span>
          </button>
        </section>`;
    }

    function scanPage() {
      const kind = scanType;
      const tabs = [
        ['message', '✉ Message'],
        ['link', '↗ Website link'],
        ['attachment', '▧ Attachment']
      ];

      const input = kind === 'attachment'
        ? `<label class="form-label" for="attach-name">Attachment name</label>
           <input class="field" id="attach-name" placeholder="For example: invoice.docm">
           <label class="form-label" for="scan-text">Who sent it, and what did they say?</label>
           <textarea class="scan-input" id="scan-text" placeholder="Add a little context, if you like…"></textarea>`
        : `<label class="form-label" for="scan-text">${kind === 'link' ? 'Paste the website address here' : 'Paste the message here'}</label>
           <textarea class="scan-input" id="scan-text" placeholder="${kind === 'link' ? 'For example: https://example.com' : 'Paste the full text of the message or email here…'}">${esc(store.get('draft', ''))}</textarea>`;

      return `${head('A MOMENT OF CARE', 'Check a message or link', 'We’ll point out things that may deserve a closer look.')}
        <div class="scan-layout">
          <section class="card form-card">
            <div class="scan-tabs">
              ${tabs.map(([type, label]) => `<button class="scan-tab ${kind === type ? 'active' : ''}" data-type="${type}">${label}</button>`).join('')}
            </div>
            ${input}
            <div class="hint-box">🔒 <strong>Your privacy matters.</strong> Checks run on this device in this demo. Avoid sharing passwords, bank details, or private codes.</div>
            <div class="scan-controls">
              <span class="helper">No question is too small. It’s good to check.</span>
              <button class="btn btn-primary" id="run-scan">Check it for me <span aria-hidden="true">→</span></button>
            </div>
          </section>
          <aside class="card info-card">
            <h2>What happens next?</h2>
            <div class="info-step"><span class="step-num">1</span><p>We look for common warning signs in the words and link.</p></div>
            <div class="info-step"><span class="step-num">2</span><p>We explain any concerns in everyday language.</p></div>
            <div class="info-step"><span class="step-num">3</span><p>You decide what to do, and can ask someone you trust.</p></div>
            <p class="privacy-note">This preview uses simple on-device checks. It does not contact banks, websites, or threat databases.</p>
          </aside>
        </div>`;
    }

    function detect(text, attachment = '') {
      const content = (text + ' ' + attachment).toLowerCase();
      const reasons = [];
      const patterns = [
        [/\b(otp|one.time passcode|verification code|password|pin)\b/, 'It asks for a private code or password.', 'Banks and trusted services will not ask you to share these by message.'],
        [/\b(urgent|immediately|act now|final warning|account.{0,15}(closed|suspend|locked))\b/, 'It is putting pressure on you to act quickly.', 'Scammers often try to stop you from taking time to check.'],
        [/\b(prize|winner|won £|won \$|claim your reward|lottery)\b/, 'It mentions a prize or reward you may not expect.', 'Unexpected prizes can be used to get your details or money.'],
        [/\b(pay|payment|fee|transfer|gift card|crypto)\b/, 'It asks you to make a payment or transfer.', 'Check with the organization using a number you already trust.'],
        [/\b(bank|hmrc|irs|social security|microsoft|apple|fedex|dhl|royal mail)\b/, 'It may be speaking on behalf of a familiar organization.', 'A name or logo in a message does not prove who sent it.']
      ];

      for (const [pattern, title, detail] of patterns) {
        if (pattern.test(content)) reasons.push({ title, detail });
      }

      const urls = content.match(/https?:\/\/[^\s<>()]+|(?:www\.)?[a-z0-9-]+\.(?:com|net|org|co\.uk|gov|info|site|xyz)(?:\/[^\s]*)?/g) || [];
      for (const url of urls) {
        if (!/^https:\/\//.test(url)) {
          reasons.push({ title: 'The link does not show a secure https address.', detail: 'This alone does not prove it is harmful, but be extra careful.' });
        }
        if (/[0-9]/.test(url) && /(bank|pay|account|secure)/.test(url)) {
          reasons.push({ title: 'The website name may be trying to look familiar.', detail: 'A small spelling change can lead to a fake website.' });
        }
      }

      if (/\.(exe|zip|docm|xlsm|js|scr|bat|msi)$/i.test(attachment)) {
        reasons.push({ title: 'This attachment type can run risky instructions.', detail: 'Do not open it unless you have confirmed with the sender another way.' });
      }

      if (!text.trim() && !attachment.trim()) return null;

      const risk = reasons.length >= 2 ? 'high' : reasons.length === 1 ? 'suspicious' : 'low';
      if (!reasons.length) {
        reasons.push({ title: 'We did not spot common warning signs.', detail: 'That is reassuring, but it cannot guarantee a message or website is safe.' });
      }

      return {
        risk,
        reasons,
        preview: (text || `Attachment: ${attachment}`).slice(0, 100),
        text: text || `Attachment: ${attachment}`,
        type: attachment ? 'attachment' : scanType,
        date: new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      };
    }

    function resultPage() {
      const scan = currentResult;
      if (!scan) return dashboard();

      const title = scan.risk === 'high'
        ? 'Pause before you act'
        : scan.risk === 'suspicious'
          ? 'Take a closer look'
          : 'We didn’t spot common warning signs';

      const message = scan.risk === 'high'
        ? 'This message has a few signs commonly used in scams. Do not click the link or share personal details.'
        : scan.risk === 'suspicious'
          ? 'Something here deserves a second look. Take your time and check with the organization another way.'
          : 'That’s a reassuring sign. Please remember, no quick check can guarantee a message is safe.';

      const score = scan.risk === 'high' ? 24 : scan.risk === 'suspicious' ? 58 : 88;

      return `${head('YOUR CHECK RESULTS', 'Here’s what we noticed', 'You did the right thing by checking first.')}
        <div class="result-hero ${scan.risk}">
          <span class="result-symbol">${scan.risk === 'high' ? '🚨' : scan.risk === 'suspicious' ? '⚠️' : '🛡️'}</span>
          <div><h2>${title}</h2><p>${message}</p></div>
          ${badge(scan.risk)}
        </div>
        <div class="result-grid">
          <section class="card result-card">
            <h2>What stood out</h2>
            ${scan.reasons.map(reason => `<div class="reason"><span aria-hidden="true">•</span><div><strong>${esc(reason.title)}</strong><p>${esc(reason.detail)}</p></div></div>`).join('')}
            <h2 style="margin-top:22px">What you checked</h2>
            <div class="message-preview">${esc(scan.text)}</div>
            <div class="result-actions">
              <button class="btn btn-primary" data-go="family">👨‍👩‍👧 Ask my family</button>
              <button class="btn btn-soft" data-go="scan">Check another</button>
              <button class="btn btn-white" data-go="home">Back to safety</button>
            </div>
          </section>
          <aside class="card result-card">
            <h2>Your safety check</h2>
            <div class="trust-score">
              <strong>${score}</strong>
              <div><strong>${scan.risk === 'high' ? 'Several concerns' : scan.risk === 'suspicious' ? 'Some concerns' : 'No common flags'}</strong><div class="subtle">Simple on-device review</div></div>
            </div>
            <div class="trust-bar"><span style="width:${score}%"></span></div>
            <p class="notice">This is a helpful guide, not a guarantee. This demo does not query live scam databases or use AI. When in doubt, contact the company using details from its official website or your card.</p>
            <button class="btn btn-soft btn-block" data-go="history">See my scan history</button>
          </aside>
        </div>`;
    }

    function historyPage() {
      const list = scans.filter(scan => filter === 'All' || scan.risk === filter.toLowerCase());

      return `${head('YOUR PERSONAL RECORD', 'Scan history', 'A simple record of things you’ve checked.')}
        <div class="filter-row">
          ${['All', 'High risk', 'Suspicious', 'Safe'].map(label => `<button class="filter-pill ${filter === label ? 'active' : ''}" data-filter="${label}">${label}</button>`).join('')}
        </div>
        <section class="card table-card">
          ${list.length
            ? list.map(scan => `<div class="history-row" data-result="${scan.id}">
                <span class="history-icon">${scan.type === 'link' ? '↗' : scan.type === 'attachment' ? '▧' : '✉'}</span>
                <div class="row-main"><strong>${esc(scan.preview)}</strong><small>${scan.type} · ${scan.date}</small></div>
                ${badge(scan.risk)}<span class="history-date">›</span>
              </div>`).join('')
            : '<div class="empty-state"><div>🗂️</div><strong>No checks in this category</strong><p>Your checks will show here when you use ElderShield.</p></div>'}
        </section>
        <p class="notice">Your scan history is saved in this browser on this device.</p>`;
    }

    function tipsPage() {
      const tips = [
        ['🔐', 'Keep passcodes private', 'Never share a one-time code, password, or PIN by text, email, or phone.', 'Passwords'],
        ['☎️', 'Call using a number you know', 'If a message claims to be from your bank, call the number on your card.', 'Impersonation'],
        ['⏳', 'Give yourself time', 'Urgency is a reason to slow down and check with someone you trust.', 'Phishing'],
        ['🔗', 'Look carefully at links', 'A familiar logo does not prove a website is genuine. Type the official address yourself.', 'Links'],
        ['🎁', 'Unexpected prizes', 'Be cautious if you must pay a fee to claim a prize you did not expect.', 'Phishing'],
        ['👥', 'Ask someone you trust', 'A second opinion can help you feel more confident before taking action.', 'Recovery']
      ];

      return `${head('SMALL STEPS, MORE CONFIDENCE', 'Stay scam smart 💡', 'Clear reminders to help you feel more confident online.')}
        <div class="filter-row">
          ${['All', 'Phishing', 'Links', 'Passwords', 'Impersonation', 'Recovery'].map(label => `<button class="filter-pill ${filter === label ? 'active' : ''}" data-filter="${label}">${label}</button>`).join('')}
        </div>
        <div class="tips-grid">
          ${tips.filter(tip => filter === 'All' || tip[3] === filter).map(tip => `<article class="card tip-card">
            <span class="big-icon">${tip[0]}</span><h3>${tip[1]}</h3><p>${tip[2]}</p>
            <span class="tag">${tip[3]}</span>
            <button class="text-button share-tip" data-tip="${esc(tip[1] + ': ' + tip[2])}">Share this tip ↗</button>
          </article>`).join('')}
        </div>`;
    }

    function emergencyPage() {
      const steps = [
        ['Change important passwords', 'Start with your email and bank accounts. Use a new, different password for each.'],
        ['Call your bank using a trusted number', 'Ask them to protect your account and check for payments you do not recognize. Use the number on your bank card.'],
        ['Stop contact with the sender', 'Do not send more money or personal details. Save the messages if you can.'],
        ['Report what happened', 'In the US, visit <a class="inline-link" target="_blank" rel="noopener" href="https://reportfraud.ftc.gov/">ReportFraud.ftc.gov</a>. In the UK, visit <a class="inline-link" target="_blank" rel="noopener" href="https://www.actionfraud.police.uk/">Action Fraud</a>.'],
        ['Tell someone you trust', 'A family member or friend can help you with the next steps.']
      ];

      return `${head('HERE WITH YOU', 'I may have been scammed', 'Take one step at a time. You are not alone.')}
        <div class="emergency-banner"><span aria-hidden="true">💛</span><div><strong>Take a breath. You can get help.</strong><p>Contact your bank using the number on your card if you shared payment details.</p></div></div>
        <section class="card recovery-list">
          ${steps.map((step, index) => `<label class="recovery-step">
            <input class="step-check" type="checkbox" data-step="${index}">
            <span><strong>${index + 1}. ${step[0]}</strong><p>${step[1]}</p></span>
          </label>`).join('')}
        </section>
        <div class="result-actions">
          <button class="btn btn-primary" data-go="family">👨‍👩‍👧 Alert my trusted contact</button>
          <button class="btn btn-soft" id="print-guide">Print this guide</button>
        </div>
        <p class="notice">Reporting websites and advice vary by country. For financial help, contact your bank using a number you already trust.</p>`;
    }

    function familyPage() {
      return `${head('YOU DON’T HAVE TO DECIDE ALONE', 'Ask someone you trust', 'A second opinion can make things feel clearer.')}
        <div class="scan-layout">
          <section class="card form-card">
            <div style="font-size:35px;margin-bottom:14px">👨‍👩‍👧</div>
            <h2>Reach out to your trusted contact</h2>
            <p class="subhead">You can ask someone to look at a message with you. This demo does not send an alert.</p>
            <label class="form-label">Your contact</label>
            <div class="contact"><div class="avatar">AM</div><span><strong>Alex Morgan</strong><small>Family contact · demo profile</small></span><span class="badge low">Available</span></div>
            <label class="form-label" for="family-note">Add a note (optional)</label>
            <textarea class="scan-input" id="family-note" placeholder="Can you help me check this message?"></textarea>
            <button class="btn btn-primary btn-block" id="send-family">Prepare a message to Alex</button>
            <p class="notice">No message is sent. Contacts are not connected in this preview.</p>
          </section>
          <aside class="card info-card">
            <h2>Need help right away?</h2>
            <p class="subhead">If money or account details may be at risk, call your bank using the number on your card.</p>
            <button class="btn btn-soft btn-block" data-go="emergency">Open recovery guide</button>
          </aside>
        </div>`;
    }

    function setting(title, description, checked) {
      return `<div class="setting-row">
        <span><strong>${title}</strong><small>${description}</small></span>
        <label class="switch"><input type="checkbox" ${checked ? 'checked' : ''}><span></span></label>
      </div>`;
    }

    function profilePage() {
      return `${head('YOUR PREFERENCES', 'My settings', 'Keep ElderShield comfortable and helpful for you.')}
        <div class="settings-grid">
          <section class="card settings-card">
            <h2>👨‍👩‍👧 Trusted contact</h2>
            <div class="contact"><div class="avatar">AM</div><span><strong>Alex Morgan</strong><small>alex@example.com</small></span>
              <button class="text-button" id="edit-contact">Edit</button></div>
            <button class="btn btn-soft" id="add-contact">＋ Add a trusted contact</button>
          </section>
          <section class="card settings-card">
            <h2>🔔 Notifications</h2>
            ${setting('Notify family about high-risk checks', 'Get help sooner when a check finds several warning signs.', true)}
            ${setting('Daily safety reminder', 'A gentle tip to help build safe habits.', false)}
          </section>
          <section class="card settings-card">
            <h2>🔎 Display</h2>
            <div class="setting-row"><span><strong>Text size</strong><small>Larger text can be easier to read.</small></span>
              <select class="field" id="font-setting"><option>Comfortable</option><option>Large</option><option>Extra large</option></select>
            </div>
          </section>
          <section class="card settings-card">
            <h2>🔒 Privacy and account</h2>
            <div class="setting-row"><span><strong>On-device demo</strong><small>Your checks stay in this browser.</small></span><span class="badge low">Private</span></div>
            <button class="text-button" id="clear-history">Clear scan history</button>
          </section>
        </div>`;
    }

    function render() {
      const pages = {
        home: dashboard,
        scan: scanPage,
        results: resultPage,
        history: historyPage,
        tips: tipsPage,
        profile: profilePage,
        emergency: emergencyPage,
        family: familyPage
      };
      $('#view').innerHTML = (pages[page] || dashboard)();
      $('#crumb').textContent = names[page] || 'Home';
    }

    function analyze() {
      const text = $('#scan-text')?.value || '';
      const attachment = $('#attach-name')?.value || '';
      const scan = detect(text, attachment);

      if (!scan) {
        toast('Add a message, link, or attachment name first.');
        return;
      }

      scan.id = Date.now();
      scans.unshift(scan);
      store.set('scans', scans);
      currentResult = scan;
      store.set('draft', '');
      go('results');
    }

    function toast(message) {
      const element = $('#toast');
      element.textContent = message;
      element.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => element.classList.remove('show'), 2800);
    }

    function modal(title, body, buttons) {
      const dialog = $('#modal');
      dialog.innerHTML = `<div class="modal-inner"><h2 id="modal-title">${title}</h2><p>${body}</p><div class="modal-actions">${buttons}</div></div>`;
      dialog.showModal();
    }

    document.addEventListener('click', event => {
      const pageButton = event.target.closest('[data-go], [data-page]');
      if (pageButton) {
        if (pageButton.dataset.kind) scanType = pageButton.dataset.kind;
        go(pageButton.dataset.go || pageButton.dataset.page);
        return;
      }

      const typeButton = event.target.closest('[data-type]');
      if (typeButton) {
        scanType = typeButton.dataset.type;
        store.set('draft', $('#quick-message')?.value || '');
        go('scan');
        return;
      }

      if (event.target.id === 'quick-check') {
        store.set('draft', $('#quick-message').value);
        scanType = 'message';
        go('scan');
        return;
      }

      if (event.target.id === 'run-scan') {
        analyze();
        return;
      }

      const resultRow = event.target.closest('[data-result]');
      if (resultRow) {
        const scan = scans.find(item => item.id == resultRow.dataset.result);
        if (scan) {
          currentResult = scan;
          go('results');
        }
        return;
      }

      const filterButton = event.target.closest('[data-filter]');
      if (filterButton) {
        filter = filterButton.dataset.filter;
        render();
        return;
      }

      if (event.target.id === 'print-guide') {
        window.print();
        return;
      }

      if (event.target.id === 'send-family') {
        modal(
          'Your note is ready',
          'This preview cannot send messages. You can call Alex using a number you already have, or copy your note to share it yourself.',
          '<button class="btn btn-white" onclick="document.querySelector(\'#modal\').close()">Close</button><button class="btn btn-primary" id="copy-note">Copy my note</button>'
        );
        return;
      }

      if (event.target.id === 'copy-note') {
        const note = $('#family-note')?.value || 'Can you help me check this message?';
        navigator.clipboard?.writeText(note);
        $('#modal').close();
        toast('Note copied if clipboard access is available.');
        return;
      }

      if (event.target.classList.contains('share-tip')) {
        const text = event.target.dataset.tip;
        if (navigator.share) navigator.share({ title: 'ElderShield safety tip', text }).catch(() => {});
        else {
          navigator.clipboard?.writeText(text);
          toast('Tip copied to share.');
        }
        return;
      }

      if (event.target.id === 'clear-history') {
        modal(
          'Clear your scan history?',
          'This will remove the checks saved in this browser.',
          '<button class="btn btn-white" onclick="document.querySelector(\'#modal\').close()">Keep history</button><button class="btn btn-danger" id="confirm-clear">Clear history</button>'
        );
        return;
      }

      if (event.target.id === 'confirm-clear') {
        scans = [];
        store.set('scans', scans);
        $('#modal').close();
        render();
        toast('Your scan history has been cleared.');
        return;
      }

      if (event.target.id === 'edit-contact' || event.target.id === 'add-contact') {
        toast('Contact management will be available when an account is connected.');
      }
    });

    document.addEventListener('change', event => {
      if (event.target.matches('.step-check')) {
        const done = store.get('steps', []);
        const step = Number(event.target.dataset.step);
        const updated = event.target.checked
          ? [...new Set([...done, step])]
          : done.filter(item => item !== step);
        store.set('steps', updated);
      }

      if (event.target.id === 'font-setting') {
        document.documentElement.style.fontSize =
          event.target.value === 'Large' ? '19px' :
          event.target.value === 'Extra large' ? '21px' : '18px';
        store.set('fontSize', event.target.value);
      }
    });

    document.addEventListener('input', event => {
      if (event.target.id === 'scan-text' && scanType === 'message') {
        store.set('draft', event.target.value);
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.target.matches('[data-result]')) {
        event.target.click();
      }
    });

    render();
  </script>
</body>
</html>
